<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Thinker Webhook</title>
</head>
<body>
  <h1>Thinker Webhook</h1>

  <!-- Webhook input -->
  <input id="webhook" type="text" placeholder="Enter Discord Webhook URL" style="width:300px;" />

  <!-- Message input -->
  <input id="msg" type="text" placeholder="What should Thinker say?" />

  <button id="send">Send to Discord</button>

  <p id="status"></p>

  <script>
    document.getElementById("send").onclick = async () => {
      const webhookUrl = document.getElementById("webhook").value;
      const text = document.getElementById("msg").value;
      const status = document.getElementById("status");

      if (!webhookUrl) {
        status.textContent = "Enter a webhook URL.";
        return;
      }

      // Prevent 404 by checking if webhook has ID + TOKEN
      if (webhookUrl.split("/").length < 7) {
        status.textContent = "Invalid webhook URL.";
        return;
      }

      if (!text) {
        status.textContent = "Type something first.";
        return;
      }

      const payload = {
        content: text
      };

      try {
        const res = await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        status.textContent = res.ok ? "Sent!" : "Error: " + res.status;
      } catch (e) {
        status.textContent = "Failed: " + e;
      }
    };
  </script>
</body>
</html>
